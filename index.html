<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дром Отзывы — Тестирование интерфейса</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dromRed: '#db1d24',
                        dromRedHover: '#b8141a',
                        darkBg: '#121212',
                        cardBg: '#1e1e1e',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-darkBg font-sans text-gray-100 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-lg">
        <div class="bg-cardBg border border-neutral-800 rounded-2xl shadow-2xl p-8">
            <div class="flex items-center gap-3 mb-6">
                <span class="bg-dromRed text-white font-bold px-2.5 py-1 rounded text-sm tracking-wide">ДРОМ</span>
                <span class="text-xs uppercase tracking-wider text-neutral-400">UX-тестирование</span>
            </div>

            <div class="space-y-4">
                <a href="pages\review.html?mode=tags"
                   class="block w-full bg-dromRed hover:bg-dromRedHover text-white font-semibold py-4 px-5 rounded-xl transition duration-150 shadow-lg shadow-red-950/30 group">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="text-base">1. Отзывы с тегами</div>
                            <div class="text-xs text-red-100 font-normal mt-0.5">
                                Якорная навигация по узлам и подсветка фрагментов
                            </div>
                        </div>
                        <span class="text-xl group-hover:translate-x-1 transition-transform">→</span>
                    </div>
                </a>
                <a href="pages\review.html?mode=plain"
                   class="block w-full bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-white font-semibold py-4 px-5 rounded-xl transition duration-150 group">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="text-base">2. Обычные отзывы (без тегов)</div>
                            <div class="text-xs text-neutral-400 font-normal mt-0.5">
                                Стандартный сплошной текст
                            </div>
                        </div>
                        <span class="text-xl text-neutral-400 group-hover:translate-x-1 transition-transform">→</span>
                    </div>
                </a>
            </div>
        </div>
    </main>

</body>
</html>
